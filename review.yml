- url: https://www.openbankingtracker.com/provider/redwood-credit-union-digital-banking
  type: Reference
  note: Open Banking Tracker lists no API products for Redwood; access is only via third-party aggregators.
- url: https://www.fintechfutures.com/793872/uk-challenger-redwood-gets-banking-licence/
  type: Reference
  note: 2017 banking-licence grant; ownership by Redwood Financial Partners (Rowland family) with Warrington Borough Council stake.
- url: https://github.com/OpenBankingUK/read-write-api-specs
  type: Reference
  note: Shared OBIE Read/Write standard (AIS/PIS/CBPII) — the standard an obligated ASPSP would conform to, not a Redwood contract.
- url: https://github.com/OpenBankingUK/opendata-api-specs
  type: Reference
  note: Shared OBIE Open Data standard (ATMs/Branches/Products) — reference only; Redwood publishes no such endpoint.
actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    Identity-only bootstrap. Redwood Bank exposes no public API surface, so
    apis[] is empty and no OpenAPI (proprietary or OBIE-standard) was saved.
    All non-fabricated common[] links point to pages verified at HTTP 200.
