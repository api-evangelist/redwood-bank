apis:
- name: Redwood Bank Website Member Authentication (Umbraco Delivery API)
  description: >-
    The OpenID Connect member-authentication surface (OpenIddict) behind the
    Umbraco headless-CMS "Content Delivery API" that powers redwoodbank.co.uk.
    This is the only live, machine-readable API surface published on the domain;
    it authenticates website members / gated content and is NOT an Open Banking
    or banking-product API. Discovered via the live
    /.well-known/openid-configuration and JWKS documents.
  humanURL: https://www.redwoodbank.co.uk/
  baseURL: https://redwoodbank.co.uk/umbraco/delivery/api/v1/
